# 2권 3부 「나만의 경쟁사 알림」 연습 폴더. 도우미 스크립트가 sh 로 읽는다. 칸의 뜻은 basics/place.conf 에 있다
BOOK='x5t8'
PART='3'
NAME='경쟁사 알림'
ARGS='경쟁사알림'
FOLDER='competitor-alert'
# 원고가 연습 파일을 클코에게 살펴보게 해서 폴더 안에 표지를 두지 않는다
FIND='registered'
STATE='account'
# 학습자가 홈 폴더에 만든 빈 폴더에 연습 파일을 펼친다
SAMPLES='top'
FIRST_UNIT='3-1'
NODE='no'
# 파일 이름의 빈칸(지켜볼 페이지.md)은 ? 로 적는다
FINGERPRINT='지켜볼?페이지.md'
# 지난 버전(타입캐스트 페이지를 고친 사본)은 남의 페이지라 재료에 싣지 않는다. /시작 이 학습지 서버에서 받아 이 폴더에 넣는다
OLD_VERSIONS='지난 버전'
