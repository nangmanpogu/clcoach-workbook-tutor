# 2권 3부 「나만의 발표 자료 비서」 연습 폴더. 도우미 스크립트가 sh 로 읽는다. 칸의 뜻은 basics/place.conf 에 있다
BOOK='x5t8'
PART='3'
NAME='발표 자료'
ARGS='발표자료'
FOLDER='deck-practice'
# 원고가 연습 파일을 클코에게 살펴보게 해서 폴더 안에 표지를 두지 않는다
FIND='registered'
STATE='account'
# 학습자가 홈 폴더에 만든 빈 폴더에 연습 파일을 펼친다
SAMPLES='top'
FIRST_UNIT='3-1'
NODE='no'
FINGERPRINT='장표-틀.pptx 디자인.md'
# 장표 틀이 쓰는 글꼴. /시작 이 이 폴더의 글꼴을 사용자 글꼴 폴더에 설치한다
FONTS='글꼴'
