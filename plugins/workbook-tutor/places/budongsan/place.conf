# 3권 2부 「부동산 실거래가 알림 앱 만들기」 샘플. 도우미 스크립트가 sh 로 읽는다. 칸의 뜻은 basics/place.conf 에 있다
BOOK='m3q6'
PART='2'
NAME='실거래가'
ARGS='실거래가'
FOLDER='app-budongsan'
# 원고 2-1 1절에서 학습자가 만든 app-budongsan 폴더다. 폴더 안에 표지를 두지 않는다
FIND='registered'
STATE='account'
# 시안대로 만든 앱(Expo)을 폴더 맨 위에 펼친다. 1절 세팅을 마친 저장소여도 받는다(아래 GIT)
SAMPLES='top'
FIRST_UNIT='2-1'
# Expo 로 앱을 띄우려면 Node.js 가 있어야 한다
NODE='yes'
# 폴더를 저장소로 만든다. 이미 저장소면 샘플을 넣은 뒤 클코가 PR 로 올린다
GIT='yes'
FINGERPRINT='data/trades.json'
# 2-1 6절의 공지 사이트. 이 폴더에서 workbook-tutor vercel 을 부르면 이 폴더만 따로 Vercel 에 잇는다(Root Directory)
VERCEL_SUBDIR='site'
