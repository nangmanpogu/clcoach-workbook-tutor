# 3권 2부 「AI 사주풀이 웹 서비스 만들기」 샘플. 도우미 스크립트가 sh 로 읽는다. 칸의 뜻은 basics/place.conf 에 있다
BOOK='m3q6'
PART='2'
NAME='사주풀이'
ARGS='사주풀이'
FOLDER='web-saju'
# 원고 2-1 1절에서 학습자가 만든 web-saju 폴더다. 폴더 안에 표지를 두지 않는다
FIND='registered'
STATE='account'
# 시안대로 만든 화면(Next.js)을 폴더 맨 위에 펼친다. 1절 세팅을 마친 저장소여도 받는다(아래 GIT)
SAMPLES='top'
FIRST_UNIT='2-1'
# 화면을 띄우고 Vercel 에 공개하려면 Node.js 가 있어야 한다
NODE='yes'
# 폴더를 저장소로 만든다. 이미 저장소면 샘플을 넣은 뒤 클코가 PR 로 올린다
GIT='yes'
FINGERPRINT='lib/saju.ts'
# 2-1 1절 세팅이 빈 폴더를 Vercel 에 이어 프레임워크가 비어 있다. /시작 이 Next.js 로 맞춘다(set_vercel_framework)
VERCEL_FRAMEWORK='nextjs'
