# 2권 3부 「나만의 문의 답장 비서」 연습 폴더. 도우미 스크립트가 sh 로 읽는다. 칸의 뜻은 basics/place.conf 에 있다
BOOK='x5t8'
PART='3'
NAME='문의 답장'
ARGS='문의답장'
FOLDER='inquiry-practice'
