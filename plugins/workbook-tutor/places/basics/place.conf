# 1권 1부 연습. 도우미 스크립트가 sh 로 읽는다. 자리 표의 칸은 아래와 같다. 값이 없는 칸은 비운다.
#   BOOK         권 코드. 장 번호(1-3)는 이 권 안에서만 찾는다
#   PART         부. 받은 장 번호의 앞자리가 다르면 그 부의 자리로 가라고 한다
#   NAME         화면에 쓰는 이름
#   ARGS         /시작 뒤에 받는 말. 띄어쓰기는 무시한다. 비우면 /시작 을 받지 않는다
#   FOLDER       기본 폴더 이름
#   FIND         폴더 찾는 법. name(이름이 FOLDER) · marker(/시작 이 둔 표지 .workbook-tutor/) · registered(/시작 이 계정 쪽에 적은 경로)
#   STATE        상태를 둘 곳. account(~/.workbook-tutor/places/<자리>/ 에만) · folder(작업 폴더 .workbook-tutor/ 와 계정 사본)
#   STATE_DIR    account 의 상태 폴더를 ~/.workbook-tutor/ 아래 이 이름으로 둔다. 설치 줄이 1부 목록을 basics/ 에 받는다
#   SAMPLES      /시작 이 재료를 넣는 곳. no · samples(폴더의 samples/ 아래) · top(폴더 맨 위에 그대로 펼침)
#   FILE_TIMES   재료를 펼친 뒤 수정 시각을 맞춘다. 비우면 맞추지 않는다. 꼴은 clipping/place.conf 에 있다
#   FIRST_UNIT   기록이 없을 때 /학습지 가 여는 장
#   NODE         /시작 이 Node.js 를 깔까(yes·no). PORT 미리보기 서버의 포트
#   GIT          /시작 이 git·GitHub CLI 를 깔고, 폴더를 저장소로 만들어 첫 저장을 할까(yes·no). 비우면 no 다
#   CONTINUES    이어 쓰는 자리. 그 자리가 /시작 을 한 폴더에서만 시작하고, 그 폴더를 이 자리로 알아본다.
#                그 자리의 기록은 그대로 둔다. 다른 폴더에서 부르면 그 자리의 폴더로 가라고 한다
#   FINGERPRINT  재료가 이 폴더에 있다고 보는 파일. 다른 자리의 /시작 을 막는다. 이름의 빈칸은 ? 로 적는다
#   FONTS        재료 안의 글꼴 폴더. /시작 이 그 안의 글꼴(.otf·.ttf)을 사용자 글꼴 폴더에 설치한다
#   PRACTICE_MAIL  yes 면 /연습문의 를 받는 자리. 이 자리의 폴더(나 그 아래)에서만 연습 문의를 보낸다
#   OLD_VERSIONS   /시작 이 학습지 서버에서 지난 버전을 받아 넣는 폴더 이름. 그 폴더에 HTML 이 있으면 받지 않는다
#   KEEP         장 끝으로 맞출 때 남길 파일. CHECKPOINTS 장 끝 모습이 있는 장. SIGNALS 「여기까지 마쳤다」 신호
BOOK='k7m2'
PART='1'
NAME='1부 연습'
ARGS=''
FOLDER='claude-practice'
# 1-3 에서 클코에게 폴더 안의 파일을 묻기 때문에 폴더 안에는 아무것도 두지 않는다
FIND='name'
STATE='account'
STATE_DIR='basics'
SAMPLES='no'
FIRST_UNIT='1-3'
NODE='no'
