# 3권 1부 「만든 것을 안전하게 공개하기」. 도우미 스크립트가 sh 로 읽는다. 칸의 뜻은 basics/place.conf 에 있다
BOOK='m3q6'
PART='1'
NAME='3권 뉴스 클리핑'
ARGS='3권'
FOLDER='news-clipping'
# 2권 1부 뉴스 클리핑 폴더를 이어 쓴다. 그 폴더에서만 시작하고, 폴더 안에 표지를 두지 않는다
FIND='registered'
STATE='account'
CONTINUES='clipping'
SAMPLES='no'
FIRST_UNIT='1-1'
# 1-2 1절의 workbook-tutor vercel 이 Vercel CLI 를 Node.js 로 돌린다
NODE='yes'
# git·GitHub CLI 를 깔고 폴더를 저장소로 만들어 첫 저장을 한다
GIT='yes'
# /연습청구 는 3권을 시작한 컴퓨터의 3권 자리 폴더(3-5 는 3부 자리 projects)에서만 보낸다. 서버도 이 자리를 /시작 한 기록을 본다
PRACTICE_BILL='yes'
