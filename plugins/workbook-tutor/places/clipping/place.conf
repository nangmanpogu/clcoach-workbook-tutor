# 2권 1부 뉴스 클리핑. 도우미 스크립트가 sh 로 읽는다. 칸의 뜻은 basics/place.conf 에 있다
BOOK='x5t8'
PART='1'
NAME='뉴스 클리핑'
ARGS='뉴스클리핑'
FOLDER='news-clipping'
# 2권 1-1 2절이 「이 폴더에 어떤 파일이 있는지」를 묻기 때문에 폴더 안에 표지를 두지 않는다
FIND='registered'
STATE='account'
# 빈 폴더에서만 시작해 연습 파일을 폴더 맨 위에 펼친다
SAMPLES='top'
# <폴더> <시각> <시각>. 폴더 안의 날짜 이름 파일(YYYY-MM-DD*.html)은 그 날짜의 첫 시각, 그 폴더의 index.html 은 가장 늦은
# 날짜 파일과 같게, 나머지 파일은 가장 이른 날짜 하루 전의 둘째 시각으로 맞춘다. 며칠에 걸쳐 쌓인 폴더처럼 보이게 한다
FILE_TIMES='clips 0805 0930'
FIRST_UNIT='1-1'
NODE='no'
FINGERPRINT='출처.md 키워드.md'
