<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>뉴스 클리핑</title><style>
:root{--bg:#fff;--ink:#191f28;--ink2:#4e5968;--sub:#8b95a1;--line:#eceef1;--soft:#f5f6f8;--accent:#3182f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;-webkit-text-size-adjust:100%;word-break:keep-all}
a{color:inherit;text-decoration:none}[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:20px 20px 48px}
nav{margin-bottom:16px;font-size:14px}nav a{color:var(--ink2)}
header{margin:8px 0 20px}header .date{color:var(--sub);font-size:13px;font-weight:500}
h1{font-size:24px;line-height:1.3;margin:4px 0 0;letter-spacing:-.02em}
.top{background:var(--soft);border-radius:12px;padding:16px 18px;margin-bottom:8px}
.top h2{font-size:13px;margin:0 0 6px;color:var(--ink2);font-weight:600}
.top ol{margin:0;padding-left:18px}.top li{font-size:15px;line-height:1.55;margin:3px 0}.top li::marker{color:var(--sub);font-weight:600}
section h2{font-size:13px;font-weight:600;color:var(--ink2);margin:28px 0 0;padding-bottom:8px;border-bottom:1px solid var(--ink)}
article{position:relative;padding:16px 0;border-bottom:1px solid var(--line)}
article h3{font-size:16px;line-height:1.45;margin:0;font-weight:600;letter-spacing:-.01em}
.meta{color:var(--sub);font-size:13px;margin-top:4px}
.tag{display:inline-block;background:var(--soft);color:var(--ink2);border-radius:4px;padding:0 6px;font-size:12px;font-weight:600;margin-right:6px;line-height:20px}
article p{margin:6px 0 0;font-size:15px;color:var(--ink2)}
article>a{display:inline-block;margin-top:8px;font-size:14px;font-weight:600;color:var(--accent)}
.days article{display:grid;grid-template-columns:1fr auto;column-gap:12px;padding:14px 0}
.days h3{font-size:13px;font-weight:600;color:var(--ink2);letter-spacing:0}
.days h3 a::after{content:"";position:absolute;inset:0}
.days .meta{margin:0;font-size:13px}
.days p{grid-column:1/-1;margin-top:4px;font-size:16px;line-height:1.5;font-weight:600;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.days article:first-of-type{background:var(--soft);border:0;border-radius:12px;padding:16px 18px;margin:12px 0 4px}
.days article:first-of-type p{font-size:18px;line-height:1.45}
.kw{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 4px;padding:0 20px 4px;scrollbar-width:none}.kw::-webkit-scrollbar{display:none}
.kw button{flex:none;height:34px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink2);font:600 14px/1 inherit;cursor:pointer}
.kw button span{margin-left:4px;color:var(--sub);font-weight:500}
.kw button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}.kw button[aria-pressed=true] span{color:#c5cad1}
footer{margin-top:32px;color:var(--sub);font-size:12px}
@media (min-width:720px){.wrap{padding-top:48px}h1{font-size:28px}}
</style></head>
<body><div class="wrap"><header><div class="date">마케팅팀 아침 업계 소식</div><h1>뉴스 클리핑</h1></header>
<section class="days"><h2>지난 클리핑</h2>
<article><h3><a href="2026-11-03.html">2026년 11월 3일 (화)</a></h3><div class="meta">기사 4건</div><p>고속도로 휴게소 전기차 충전소가 붐벼요.</p></article>
<article><h3><a href="2026-11-02.html">2026년 11월 2일 (월)</a></h3><div class="meta">기사 11건</div><p>삼성·SK 주가가 다시 오르며 반도체 걱정이 한풀 꺾였어요.</p></article>
<article><h3><a href="2026-10-30.html">2026년 10월 30일 (목)</a></h3><div class="meta">기사 6건</div><p>AI 우려에 반도체주가 흔들리며 코스피가 3.5% 내렸어요.</p></article>
</section>
<footer>뉴스 클리핑 · 마케팅팀</footer></div></body></html>
